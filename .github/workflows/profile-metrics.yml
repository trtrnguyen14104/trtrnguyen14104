name: Update profile metrics

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 in Vietnam
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-metrics.py
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate public GitHub metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update-metrics.py --user "${{ github.repository_owner }}"
      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update profile metrics"
          git push
